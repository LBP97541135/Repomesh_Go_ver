# Local verification only. Launch through scripts/observe-local.sh so these
# variables resolve to loopback and an owned per-start evidence file.
receivers:
  otlp:
    protocols:
      http:
        endpoint: "127.0.0.1:${env:REPOMESH_OTLP_PORT}"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

exporters:
  file:
    path: "${env:REPOMESH_OTEL_TRACE_FILE}"
    format: json
    append: true
    flush_interval: 100ms

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [file]
