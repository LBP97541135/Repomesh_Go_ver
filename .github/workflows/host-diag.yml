name: host-diag

# 为什么存在：机器被压到 load 130+ 时，sshd 自己会被饿死 —— TCP 连得上，但
# SSH banner 换不出来，于是**根本进不去看是谁在吃机器**。这个工作流把"看机器状态"
# 这件事从 SSH 挪到自托管 runner 上（它本来就跑在那台机器上），日志走 GitHub API 读回来。
#
# 触发面刻意收窄：
#   · 只在 **diag 分支**上 push 时跑 —— main 不碰，所以绝不会触发部署；
#   · 绝不加 pull_request 触发（这个 runner 是生产机上的 root，仓库又是公开的）；
#   · 只跑**只读**命令，不改任何东西、不重启任何服务。
on:
  push:
    branches: [diag]

jobs:
  diag:
    runs-on: [self-hosted, linux, repomesh-deploy]
    steps:
      - name: 机器状态快照（只读）
        run: |
          # Actions 的 run 默认是 bash -e，一条命令失败就整步中止 —— 这里必须
          # 把所有输出都拿到，所以显式关掉。
          set +e
          echo "===== load / uptime ====="
          cat /proc/loadavg
          uptime
          echo "===== 内存 ====="
          free -m
          echo "===== 进程状态分布 ====="
          ps -eo stat --no-headers | awk '{print substr($1,1,1)}' | sort | uniq -c | sort -rn | head -n 6
          echo "总进程数: $(ps -e --no-headers | wc -l)"
          echo "===== RSS 汇总（前 15）====="
          ps -eo rss,comm --no-headers | awk '{a[$2]+=$1} END{for(k in a) printf "%8.1f MB  %s\n", a[k]/1024, k}' | sort -rn | head -n 15
          echo "===== CPU 前 15 ====="
          ps -eo pcpu,etime,args --no-headers --sort=-pcpu | head -n 15 | cut -c1-130
          echo "===== 关键进程计数 ====="
          for n in "qwenpaw app" qwenpaw-worker mc.bin "codex exec" "find /" containerd-shim envoy java postgres; do
            printf "%-18s %s\n" "$n" "$(pgrep -fc "$n" 2>/dev/null || echo 0)"
          done
          echo "===== D 态（卡 I/O）====="
          ps -eo pid,stat,etime,args --no-headers | awk '$2 ~ /^D/' | head -n 15 | cut -c1-130
          echo "===== I/O 与 CPU 等待 ====="
          vmstat 1 3
          echo "===== OOM 计数 ====="
          dmesg -T 2>/dev/null | grep -ci 'oom-kill' || true
          echo "===== repomesh 服务 ====="
          systemctl is-active repomesh-web repomesh-coordinator repomesh-host-executor repomesh-observe
          echo "===== 本机 8080 ====="
          curl -s -m 10 -o /dev/null -w "healthz -> %{http_code} (%{time_total}s)\n" http://127.0.0.1:8080/healthz
          echo "===== 磁盘 ====="
          df -h / | tail -n 1
