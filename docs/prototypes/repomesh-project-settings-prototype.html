<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepoMesh · 项目配置编辑 F02</title>
<style>
:root{color-scheme:dark;font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;color:#dedede;background:#131313}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:#252525;border:1px solid #3b3b3b;border-radius:8px;padding:8px 13px}button:hover{background:#303030}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #9ba8b1;outline-offset:3px}a{color:#c7d5ce}h1{font-size:22px;font-weight:500;margin:0 0 5px}h2{font-size:15px;font-weight:500;margin:0}p{margin:8px 0 14px}small,.muted{color:#a0a0a0;font-size:12px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.side{background:#191919;border-right:1px solid #303030;padding:17px 12px;display:flex;flex-direction:column}.brand{padding:0 8px 28px;font-weight:500}.side .label{color:#999;font-size:12px;padding:12px 9px}.side .nav{display:block;margin:4px 0;padding:9px 12px;color:#bbb;text-decoration:none;font-size:13px}.side .active{background:#292929;border-radius:8px;color:#eee}.profile{margin-top:auto;padding:30px 8px 0;font-size:12px;color:#aaa}.main{min-width:0}.top{padding:16px 26px;color:#999;font-size:12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #262626}.top span:last-child{margin-left:auto}.mobile{display:none}.content{max-width:820px;margin:0 auto;padding:32px 32px 0}.section{padding:24px 0;border-bottom:1px solid #303030}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.field{display:block;font-size:12px;color:#bdbdbd;margin:15px 0}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #3c3c3c;background:#202020;border-radius:8px;padding:10px 12px;margin-top:7px;font-size:14px}.field textarea{min-height:90px;resize:vertical}.row{padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.row+.row{border-top:1px solid #292929}.row>span{min-width:0;overflow-wrap:anywhere}.row small{display:block;margin-top:2px}.badge{font-size:11px;border:1px solid #3b483e;border-radius:5px;padding:2px 7px;color:#90b899;white-space:nowrap}.amber{color:#d7b788;border-color:#504330}.notice{padding:14px 16px;border:1px solid #504330;background:#252119;border-radius:9px;font-size:13px;margin:18px 0}.notice.good{border-color:#35463a;background:#1c241e;color:#a9c8b2}.notice p:last-child{margin-bottom:0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.primary{background:#ddd;color:#202020;border-color:#ddd}.primary:hover{background:#f4f4f4}.bar{padding:18px 0 24px;position:sticky;bottom:0;background:#131313f5;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #303030}.bar .actions{margin:0}.panel{border:1px solid #383838;border-radius:10px;background:#191919;padding:16px;margin:16px 0}.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:16px 0}.check input{margin:5px 0 0;accent-color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tools{background:#1b1b1b;border-top:1px solid #383838;padding:12px 20px;color:#999;font-size:11px}.tools summary{cursor:pointer;color:#c6b59c}.tools .actions{margin:10px 0}.tools select{background:#252525;border:1px solid #444;border-radius:6px;padding:5px;max-width:100%}.tools button{font-size:11px;padding:5px 9px}.error{color:#d7b788;font-size:12px}.empty{padding:22px 0;color:#999}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px;overflow-wrap:anywhere}.compare p{white-space:pre-wrap;font-size:13px}.tag{font-size:11px;color:#aaa}.repo-label{display:flex;gap:10px;padding:11px 0;align-items:flex-start}.repo-label input{margin-top:6px;accent-color:#aaa}.repo-label small{display:block}code{font-size:11px;overflow-wrap:anywhere}.recover{overflow-wrap:anywhere}.hidden{display:none}
@media(min-width:1150px){.shell{grid-template-columns:254px minmax(0,1fr)}}@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.shell.show-side .side{display:flex}.mobile{display:block}.content{padding:24px 22px 0}}@media(max-width:560px){.content{padding:22px 17px 0}.top{padding:12px 17px}.grid,.compare{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.row{flex-wrap:wrap;gap:8px}.field input,.field textarea,.field select{font-size:16px}.section{padding:20px 0}.tools{padding:12px 17px}h1{font-size:21px}}
</style></head><body><div id="app"></div>
<script>
(()=>{
const root=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={name:'订单系统',purpose:'协调订单服务与运营后台，共同维护订单管理能力。',revision:'prjrev_demo_7',config:'cfgrev_demo_3',model:'inherit',execution:'exec_default',repoIds:['orders','admin']};
const allRepos=[{id:'orders',name:'repomesh/order-service'},{id:'admin',name:'repomesh/admin-console'},{id:'billing',name:'partner/billing-api',appMissing:true},{id:'inventory',name:'repomesh/inventory'}];
let saved=structuredClone(initial),draft=structuredClone(initial),stage='edit',scenario='success',readState='ok',oldRestricted=false,addOpen=false,addUnknown=false,selected=new Set(),changeConfig=false,op=null,receipt=null,error='',sidebar=false,query='',conflictLoaded=false;
const b=(label,act,cls='',disabled=false)=>`<button type="button" data-act="${act}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`;
const modelName=v=>v==='inherit'?'继承平台默认':v==='model_team'?'团队语言模型':'待修复模型配置';
const execName=v=>v==='inherit'?'继承平台默认':'标准执行配置';
function changed(){return draft.name!==saved.name||draft.purpose!==saved.purpose||selected.size>0||changeConfig}
function tools(){return `<details class="tools" open><summary>F02 原型演示控制 · 仅内存样例，刷新重置</summary><div class="actions"><label>下次提交结果 <select aria-label="下次提交结果" id="scenario">${[['success','保存成功'],['conflict','项目修订冲突'],['unknown','结果未知 → 查询成功'],['notfound','查询 404 → 继续未知'],['removed','查询 410 → 结果已清理'],['validation','字段校验失败'],['keyconflict','同键输入冲突'],['forbidden','当前不可编辑']].map(([v,n])=>`<option value="${v}" ${scenario===v?'selected':''}>${n}</option>`).join('')}</select></label>${b('原仓库受限／恢复','restricted')}${b('新增范围核查未知／恢复','addUnknown')}${b('模拟读取失败','readError')}${b('模拟读取加载','loading')}${b('模拟失去项目访问','noAccess')}${b('重置样例','reset')}</div><small>没有真实请求、持久化或核权。展示值与结果均预置；F04精确模型应用、F03完整发现、跨刷新恢复另行设计。</small></details>`}
function currentConfig(){return `<div class="row"><span>模型引用<small>${modelName(saved.model)}</small></span><span class="badge amber">${saved.model==='inherit'?'尚未解析可用模型':'参数检查待核实'}</span></div><div class="row"><span>执行引用<small>${execName(saved.execution)}</small></span><span class="muted">当前已固定配置</span></div><div class="row"><span>Worker 并发 / 验证小组</span><span>1 / 关闭</span></div><div class="row"><span>预算与时限</span><span class="muted">尚未取得有效值</span></div>`}
function repositoryRows(){return saved.repoIds.map(id=>allRepos.find(r=>r.id===id)).filter(r=>!(oldRestricted&&r.id==='admin')).map(r=>`<div class="row"><span>▱ ${r.name}<small>账号可读取</small></span><span class="badge ${r.appMissing?'amber':''}">${r.appMissing?'App 工作授权待补齐':'App 工作授权可用'}</span></div>`).join('')+(oldRestricted?'<div class="notice">还有 1 个已保存仓库本次未披露。原因可能是权限受限或核查未知。<p class="muted">项目范围仍保留；你可以继续修改资料与配置。</p></div>':'')}
function picker(){return `<div class="panel"><h2>明确添加仓库</h2><p class="muted">只展示当前已发现且可读的候选。没有匹配项不代表没有其他可参与仓库。</p>${addUnknown?'<div class="notice">无法核实本次新增范围。旧候选名称已隐藏；待核查选择不会静默删除。</div>':`<label class="field">搜索当前候选<input id="repo-query" value="${esc(query)}" aria-label="搜索当前候选"></label>${allRepos.filter(r=>!saved.repoIds.includes(r.id)&&r.name.toLowerCase().includes(query.toLowerCase())).map(r=>`<label class="repo-label"><input type="checkbox" data-repo="${r.id}" ${selected.has(r.id)?'checked':''}><span>${r.name}<small>账号可读取 · ${r.appMissing?'App 工作授权待补齐':'App 工作授权可用'}</small></span></label>`).join('')||'<div class="empty">当前没有匹配候选</div>'}`}<p class="muted">本次待添加 ${selected.size} 个。保存后才进入项目范围，在途 Issue 保留原范围。</p>${b('收起候选','addToggle')}${selected.size?b('撤回本次待添加选择','clearAdd'):''}</div>`}
function edit(){return `<div class="section"><h2>项目资料</h2><label class="field">项目名称<input data-field="name" aria-label="项目名称" value="${esc(draft.name)}"></label><label class="field">项目用途<textarea data-field="purpose" aria-label="项目用途">${esc(draft.purpose)}</textarea></label><small>用于说明共同目标与各仓关系。</small></div><div class="section"><div class="section-title"><h2>已保存仓库</h2>${b('＋ 添加仓库','addToggle')}</div>${repositoryRows()}${addOpen?picker():selected.size?`<div class="notice">${addUnknown?'本次新增范围核查未知':'本次明确待添加 '+selected.size+' 个仓库'}${b('查看待添加选择','addToggle')}</div>`:''}</div><div class="section"><h2>配置引用</h2>${currentConfig()}<label class="check"><input type="checkbox" id="change-config" ${changeConfig?'checked':''}><span>本次更新配置引用<small style="display:block">未勾选时，保存资料或加仓会保留当前固定配置。</small></span></label>${changeConfig?`<div class="panel"><div class="grid"><label class="field">模型配置<select data-field="model" aria-label="模型配置"><option value="inherit" ${draft.model==='inherit'?'selected':''}>继承平台默认</option><option value="model_team" ${draft.model==='model_team'?'selected':''}>团队语言模型</option><option value="model_repair" ${draft.model==='model_repair'?'selected':''}>待修复模型配置</option></select></label><label class="field">执行配置<select data-field="execution" aria-label="执行配置"><option value="exec_default" ${draft.execution==='exec_default'?'selected':''}>标准执行配置</option><option value="inherit" ${draft.execution==='inherit'?'selected':''}>继承平台默认</option></select></label></div><div class="notice">保存时会重新解析模型和执行两项引用，即使仍选择相同配置，也可能采用更新后的版本。<p class="muted">这里不能锁定预览中的具体版本。若需要仅更换模型并精确保留执行版本，专用应用流程仍待设计。</p></div><p class="muted">配置存在但暂不可用时可保存待修复引用；不在这里填写 API Key、预算数值或宿主命令。</p></div>`:''}</div>${error?`<p role="alert" class="error">${esc(error)}</p>`:''}<div class="bar"><small>保存不会启动实例或改变在途 Issue。</small><div class="actions">${b('撤回未提交修改','discard','',!changed())}${b('查看本次改动 →','review','primary',!changed())}</div></div>`}
function summary(){return `<div class="row"><span>项目名称</span><span>${esc(draft.name)}</span></div><div class="row"><span>项目用途</span><span>${esc(draft.purpose)}</span></div><div class="row"><span>已有仓库范围</span><span>完整保留${oldRestricted?'（含本次未披露部分）':''}</span></div><div class="row"><span>明确添加</span><span>${addUnknown?'核查未知':selected.size?allRepos.filter(r=>selected.has(r.id)).map(r=>r.name).join('、'):'无'}</span></div><div class="row"><span>配置引用</span><span>${changeConfig?modelName(draft.model)+' / '+execName(draft.execution):'保留当前固定配置'}</span></div>${changeConfig?'<div class="notice">两项引用均按保存时有效配置重新解析，实际固定结果保存后回读。此处没有精确版本锁定保证。</div>':''}`}
function review(){return `<div class="section"><h2>本次改动</h2>${summary()}${addUnknown&&selected.size?'<div class="notice">新增范围尚未核实，当前无法提交。可以返回撤回本次待添加选择，再单独保存资料或配置。</div>':''}<p class="muted">本次改动一起保存；任一新增仓库校验失败，整个更新不提交。</p><div class="actions">${b('返回编辑','back')}${b('确认保存','submit','primary',addUnknown&&selected.size>0)}</div></div>`}
function recovery(){return `<div class="section"><h2>${stage==='pending'?'正在保存…':'保存结果待确认'}</h2><div class="notice" role="status">${stage==='pending'?'正在等待这次保存的结果。':op.scenario==='notfound'&&op.queries?'当前尚未查到提交记录，仍无法判断这次保存是否完成。':'这次保存可能已经提交，请核查原保存结果。'}<p class="muted">离开等待不撤销提交，也不会自动发起第二次保存。</p></div><p class="recover muted">原保存标识：${esc(op.id)}</p>${op.retried?'<p class="muted">已按原标识与确切原输入重试（模拟），结果仍待查询。</p>':''}${stage==='unknown'?`<div class="actions">${b('查询原保存结果','query','primary')}${op.input?b('按原输入重试同一次保存','retry'):''}${b('稍后核查','later')}</div>${!op.input?'<p class="muted">原输入已丢失，只能查询；不会根据当前表单猜测原请求。</p>':''}<details class="panel"><summary>原型恢复场景</summary>${b('模拟原输入丢失','loseInput')}<p class="muted">实际浏览器恢复路径设计：</p><code>/projects/prj_demo/updates/${esc(op.id)}</code><p class="muted">本 HTML 未实现该路由或跨刷新存储，刷新会重置演示。</p></details>`:`<div class="actions">${b('继续显示模拟返回结果','resolve','primary')}</div>`}</div>`}
function result(){if(stage==='success')return `<div class="section"><div class="notice good" role="status">这次更新已保存。<p class="muted">仅说明项目记录已保存；模型调用和运行就绪仍需单独核验。</p></div><details class="panel"><summary>这次保存的回执</summary><code>${esc(receipt.id)} · ${esc(receipt.revision)}</code><p class="muted">这是原提交的固定回执，项目最新状态需重新读取。</p></details><div class="actions">${b('读取项目最新状态','latest','primary')}</div></div>`;
if(stage==='later')return `<div class="section"><div class="notice">有一笔保存结果尚未确认。</div><p class="muted">继续编辑前先核查原保存，避免把相同意图重复提交。</p>${b('继续核查原保存','resume','primary')}</div>`;
if(stage==='conflict')return `<div class="section"><h2>项目已被其他操作更新</h2><p class="muted">本次提交因修订冲突未保存。有权读取的草稿已保留，先读取最新项目再核对。</p>${conflictLoaded?`<div class="compare"><div class="panel"><span class="tag">当前服务器用途</span><p>${esc(saved.purpose)}</p></div><div class="panel"><span class="tag">你的用途草稿</span><p>${esc(draft.purpose)}</p></div></div><p class="muted">沿最新项目作为基础，保留本次实际修改的字段、明确增仓和配置选择；未编辑字段沿最新项目；不会自动再次提交。若继续保存，将作为核对后的新操作。</p><div class="actions">${b('以最新项目为基础继续编辑','rebase','primary')}${b('放弃草稿，使用最新项目','useLatest')}</div>`:b('读取最新项目并比较','loadConflict','primary')}</div>`;
if(stage==='removed')return `<div class="section"><div class="notice">原保存结果已清理。<p>无法恢复原回执，不再执行这笔旧操作。</p></div>${b('只读查看项目当前状态','readCurrent','primary')}</div>`;
if(stage==='current')return `<div class="section"><h2>项目当前状态</h2><p>${esc(saved.name)}</p><p>${esc(saved.purpose)}</p><p class="muted">当前快照不能证明已清理或冲突操作的原结果。此处不提供旧键重执行。</p></div>`;
if(stage==='keyconflict')return `<div class="section"><div class="notice">原保存标识与提交内容不一致。<p>原操作已保留，不把新输入绑定到旧标识。</p></div>${b('查询原保存结果','queryOriginal','primary')}</div>`;
return `<div class="section"><div class="notice">当前没有编辑资格。</div><p class="muted">项目外壳仍可读，停止本次编辑；不会改用其他身份提交。</p></div>`}
function render(){let body;if(readState==='noAccess')body='<div class="section"><h1>项目暂不可访问</h1><p class="muted">已撤下项目内容与草稿，请先恢复访问资格。</p></div>';else if(readState!=='ok')body=`<div class="section"><h1>${readState==='loading'?'正在读取项目…':'项目读取失败'}</h1><p class="muted">${readState==='loading'?'等待当前项目与编辑资格。':'无法取得当前快照，暂不显示可提交表单。'}</p>${b('重新读取（模拟）','readAgain','primary')}</div>`;else body=`<h1>项目设置</h1><p class="muted">维护项目资料、仓库范围和所用配置。</p>${stage==='edit'?edit():stage==='review'?review():stage==='pending'||stage==='unknown'?recovery():result()}`;
root.innerHTML=`<div class="shell ${sidebar?'show-side':''}"><aside class="side"><div class="brand">▧　RepoMesh</div><span class="label">项目与会话</span><span class="nav">${readState==='noAccess'?'项目':esc(saved.name)}</span><span class="nav active">⚙ 项目设置</span><a class="nav" href="repomesh-project-entry-prototype.html?screen=repositories">＋ 新建项目原型</a><div class="profile">林悦　<span class="muted">示例账号</span></div></aside><main class="main"><header class="top">${b('☰','sidebar','mobile')}<span>${readState==='noAccess'?'RepoMesh':esc(saved.name)} ／ 项目设置</span><span>林悦</span></header><div class="content">${body}</div></main></div>${tools()}`;
}
function inputBody(){const payload={expectedProjectRevision:draft.revision};if(draft.name!==saved.name)payload.name=draft.name;if(draft.purpose!==saved.purpose)payload.purpose=draft.purpose;if(selected.size)payload.repositoryIdsToAdd=[...selected].sort();if(changeConfig)payload.configuration={modelProfile:draft.model==='inherit'?{mode:'inherit'}:{mode:'reference',id:draft.model},executionProfile:draft.execution==='inherit'?{mode:'inherit'}:{mode:'reference',id:draft.execution}};return payload}
function validate(){error='';if(!draft.name.trim()||!draft.purpose.trim())error='请填写项目名称与用途。';else if([...draft.name].length>200||[...draft.purpose].length>20000)error='项目名称最多 200 个字符，用途最多 20,000 个字符。';return !error}
function commit(){if(!receipt){const p=op.serverInput;if(p){if(p.name!==undefined)saved.name=p.name;if(p.purpose!==undefined)saved.purpose=p.purpose;if(p.repositoryIdsToAdd)saved.repoIds=[...new Set([...saved.repoIds,...p.repositoryIdsToAdd])];if(p.configuration){saved.model=p.configuration.modelProfile.mode==='inherit'?'inherit':p.configuration.modelProfile.id;saved.execution=p.configuration.executionProfile.mode==='inherit'?'inherit':p.configuration.executionProfile.id;saved.config='cfgrev_demo_saved'}saved.revision='prjrev_demo_saved'}receipt={id:op.id,revision:saved.revision}}stage='success'}
root.addEventListener('input',e=>{if(e.target.dataset.field)draft[e.target.dataset.field]=e.target.value;if(e.target.id==='repo-query'){query=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('repo-query');el.focus();el.setSelectionRange(pos,pos)}else if(stage==='edit'){const reviewButton=root.querySelector('[data-act="review"]');if(reviewButton)reviewButton.disabled=!changed();const discardButton=root.querySelector('[data-act="discard"]');if(discardButton)discardButton.disabled=!changed()}});
root.addEventListener('change',e=>{if(e.target.id==='scenario')scenario=e.target.value;if(e.target.id==='change-config')changeConfig=e.target.checked;if(e.target.dataset.repo)e.target.checked?selected.add(e.target.dataset.repo):selected.delete(e.target.dataset.repo);render()});
root.addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
if(a==='reset'){location.reload();return}if(a==='sidebar')sidebar=!sidebar;
if(a==='restricted')oldRestricted=!oldRestricted;if(a==='addUnknown')addUnknown=!addUnknown;
if(a==='noAccess'){readState='noAccess';draft={};saved={name:'',purpose:'',repoIds:[]};selected.clear();op=null;receipt=null}
if(a==='readError')readState='error';if(a==='loading')readState='loading';if(a==='readAgain'){if(!saved.revision){readState='noAccess'}else readState='ok'}
if(a==='addToggle')addOpen=!addOpen;if(a==='clearAdd'){selected.clear();addUnknown=false}
