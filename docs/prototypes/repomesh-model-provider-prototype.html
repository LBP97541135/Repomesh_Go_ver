<!-- 用户参考图布局；填写项基于AgentTeams 517caff。仅内存原型，无API、真实密钥、真实探测或运行导出。 -->
<div id="repomesh-rooms-prototype"><main class="page"><div class="crumb"><span>⬡ RepoMesh</span><span>/</span><span>个人设置</span></div><h1>模型设置</h1><p class="desc">管理供应商连接与模型参数，再为项目选择具体模型。</p><div class="notice" id="notice" role="status" aria-live="polite"></div><div class="panel"><aside class="providers"><div class="group">我的供应商</div><div id="provider-list"></div><button id="add-provider" style="margin-top:12px">＋ 添加供应商</button></aside><section class="detail"><div class="title"><h2 id="provider-title"></h2><span class="rm-badge" id="version"></span><span class="minor" id="dirty-state"></span></div><form id="provider-form"><label class="field">供应商名称<input id="provider-name" required maxlength="100"></label><label class="field">Base URL<input id="base-url" type="url" required placeholder="https://gateway.example.invalid/v1"><small>填写兼容 API 的基础地址；不含 /chat/completions。</small></label><label class="field">API 格式<select id="format"><option>OpenAI Chat Completions</option></select><small>当前展示 AgentTeams 自定义 OpenAI 兼容接入。</small></label><label class="field">API Key<div class="keyrow"><input id="provider-key" readonly aria-label="API Key 状态"><button type="button" id="replace-key" class="outline">替换演示密钥</button></div><small>已保存密钥不回显；此原型只接受演示占位。</small></label><div class="modelhead"><span>模型列表</span><span class="minor">每个模型单独测试、选择</span></div><div id="models" class="models"></div><button type="button" id="add-model" class="addmodel">＋ 添加模型</button><div class="savebar"><span class="minor" id="save-hint">已保存的配置</span><div><button type="button" id="discard">撤销修改</button><button type="submit" id="save" class="primary">保存配置</button><button type="button" id="query-save" class="outline" hidden>核查原保存</button></div></div></form></section></div><div class="project" id="project"></div></main>
<footer class="tools"><span>独立原型 · AgentTeams 517caff 源码字段 · 无真实连接</span><label>保存 <select id="save-result"><option value="success">正常</option><option value="unknown">结果未知</option></select></label><label>测试 <select id="test-result"><option value="pass">通过</option><option value="fail">失败</option><option value="unknown">结果未知</option></select></label><button id="reset">重置演示</button></footer>
<dialog id="model-dialog" aria-labelledby="model-title"><form id="model-form"><div class="modalhead"><h2 id="model-title">添加模型</h2><button type="button" data-close="model-dialog" aria-label="关闭模型弹窗">×</button></div><div class="modalbody"><label class="field">从 AgentTeams 预设填入<select id="preset"><option value="">自定义模型</option><option value="deepseek-chat">deepseek-chat</option><option value="deepseek-reasoner">deepseek-reasoner</option><option value="qwen3.6-plus">qwen3.6-plus</option></select><small>参数来自锁定源码预设，请按你的实际服务核实。</small></label><label class="field">模型 ID<input id="model-id" required placeholder="服务商提供的完整模型 ID"></label><label class="field">显示名称（可选）<input id="model-name" placeholder="默认使用模型 ID"></label><details id="advanced" open><summary>模型参数</summary><div class="params"><div class="twocol"><label class="field">上下文窗口（Token）<input type="number" min="1" step="1" required id="context"></label><label class="field">最大输出（Token）<input type="number" min="1" step="1" required id="max-tokens"></label></div><div class="twocol"><label class="field">推理能力<select id="reasoning" required><option value="">请选择</option><option value="true">支持</option><option value="false">不支持</option></select></label><label class="field">图片输入<select id="vision" required><option value="">请选择</option><option value="true">文本 + 图片</option><option value="false">仅文本</option></select></label></div><p class="minor">能力声明应与实际模型一致；推理能力不等于推理强度。</p></div></details><div id="model-error" class="notice" role="alert"></div></div><div class="modalfoot"><button type="button" data-close="model-dialog">取消</button><button type="submit" class="primary">加入配置草稿</button></div></form></dialog>
<dialog id="project-dialog" aria-labelledby="project-title"><div class="modalhead"><h2 id="project-title">用于项目</h2><button data-close="project-dialog" aria-label="关闭项目弹窗">×</button></div><div class="modalbody"><label class="field">项目<select><option>订单系统</option></select></label><div id="preview" class="box"></div><p class="minor">仅更换所选项目的模型；执行配置保留当前引用和有效版本，其他项目与在途 Issue 不切换。</p><p class="minor">必要配置与权限另行核查。版本绑定与精确保留依赖后续专用应用协议，本页仅演示。</p></div><div class="modalfoot"><button data-close="project-dialog">取消</button><button id="apply-model" class="primary">保存项目配置</button></div></dialog>
</div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),copy=o=>JSON.parse(JSON.stringify(o)),esc=o=>String(o).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const presets={'deepseek-chat':{context:256000,max:128000,reasoning:true,vision:false},'deepseek-reasoner':{context:256000,max:128000,reasoning:true,vision:false},'qwen3.6-plus':{context:200000,max:64000,reasoning:true,vision:true}};
let providers=[{id:1,name:'开发网关',base:'https://gateway.example.invalid/v1',key:true,version:1,models:['deepseek-chat','deepseek-reasoner'].map(id=>({id,name:id,...presets[id],test:'untested',time:null}))}],selected=1,draft=copy(providers[0]),dirty=false,pending=null,editing=-1,project=null,applying=null;
const statuses={untested:'未测试',pass:'本次测试通过',fail:'本次测试失败',unknown:'结果待确认'};
function notice(t){$('#notice').textContent=t}
function hasUnknown(){return draft.models.some(m=>m.test==='unknown')}
function changed(){dirty=true;renderParts()}
function draw(){ $('#provider-name').value=draft.name;$('#base-url').value=draft.base;renderParts() }
function renderParts(){
$('#provider-title').textContent=draft.name||'新供应商';$('#version').textContent=draft.version?'v'+draft.version:'未保存';$('#dirty-state').textContent=dirty?'有未保存修改':'';
$('#provider-list').innerHTML=providers.map(p=>`<button type="button" class="provider ${selected===p.id?'selected':''}" data-provider="${p.id}"><span>⬡　${esc(p.name)}</span><i title="已保存配置，不代表通过测试"></i></button>`).join('');
$('#provider-key').value=draft.key?'••••••••（已配置）':'尚未配置';$('#replace-key').textContent=draft.key?'替换演示密钥':'使用演示密钥';
$('#models').innerHTML=draft.models.length?draft.models.map((m,i)=>`<div class="model"><div class="modeltop"><span class="modelid">${esc(m.name||m.id)}</span><span class="rm-badge">${m.context.toLocaleString()} Token</span><button type="button" class="outline" data-action="edit" data-index="${i}" ${pending||hasUnknown()?'disabled':''}>编辑</button></div>${m.name!==m.id?`<div class="minor">${esc(m.id)}</div>`:''}<div class="minor">最大输出 ${m.max.toLocaleString()} · ${m.reasoning?'支持推理':'不支持推理'} · ${m.vision?'文本 + 图片':'仅文本'}</div><div class="modelactions"><span class="minor">${dirty?'修改后需重新测试':statuses[m.test]}${!dirty&&m.time?' · '+esc(m.time):''}</span><button type="button" data-action="test" data-index="${i}" ${dirty||pending?'disabled':''}>${m.test==='unknown'?'查询原测试':'测试'}</button><button type="button" data-action="apply" data-index="${i}" ${dirty||pending?'disabled':''}>用于项目</button></div>${!dirty&&m.test==='pass'?'<div class="minor">仅证明该模型本次探测通过，不代表运行或任务就绪。</div>':''}${!dirty&&m.test==='fail'?'<div class="minor">演示：该模型访问被拒绝。检查服务商权限及配置。</div>':''}</div>`).join(''):'<div class="model minor">添加至少一个模型，配置后可用于项目。</div>';
$('#provider-name').disabled=Boolean(pending)||hasUnknown();$('#base-url').disabled=Boolean(pending)||hasUnknown();$('#replace-key').disabled=Boolean(pending)||hasUnknown();$('#add-model').disabled=Boolean(pending)||hasUnknown();$('#add-provider').disabled=Boolean(pending);
$('#save').disabled=!dirty||Boolean(pending);$('#discard').disabled=!dirty||Boolean(pending);$('#query-save').hidden=!pending;$('#save-hint').textContent=pending?'保存结果未知，请核查原保存':dirty?'先保存修改，再测试或用于项目':'配置已保存；模型测试相互独立';
$('#project').textContent=project?`订单系统当前使用：${project.provider} / ${project.model} · 供应商快照 v${project.version}。执行配置：开发容器 v2（保留）。`:'订单系统：尚未选择模型。选择模型行的“用于项目”后明确应用。';
}
function openModel(i){editing=i;const m=i<0?null:draft.models[i];$('#model-title').textContent=m?'编辑模型':'添加模型';$('#preset').value='';$('#model-id').value=m?.id||'';$('#model-name').value=m?.name||'';$('#context').value=m?.context||'';$('#max-tokens').value=m?.max||'';$('#reasoning').value=m?String(m.reasoning):'';$('#vision').value=m?String(m.vision):'';$('#model-error').textContent='';$('#advanced').open=true;$('#model-dialog').showModal()}
$('#provider-name').oninput=e=>{draft.name=e.target.value;changed()};$('#base-url').oninput=e=>{draft.base=e.target.value;changed()};$('#replace-key').onclick=()=>{draft.key=true;changed();notice('已使用演示密钥，保存后形成新配置版本。')};
$('#provider-list').onclick=e=>{const b=e.target.closest('[data-provider]');if(!b)return;if(dirty||pending){notice('请先保存或撤销当前修改，再切换供应商。');return}selected=Number(b.dataset.provider);draft=copy(providers.find(p=>p.id===selected));draw();notice('')};
$('#add-provider').onclick=()=>{if(dirty||pending){notice('请先保存或撤销当前修改，再添加供应商。');return}selected=null;draft={id:null,name:'',base:'',key:false,version:0,models:[]};dirty=true;draw();$('#provider-name').focus()};
$('#add-model').onclick=()=>openModel(-1);$('#preset').onchange=e=>{const id=e.target.value,p=presets[id];if(!p)return;$('#model-id').value=id;$('#model-name').value=id;$('#context').value=p.context;$('#max-tokens').value=p.max;$('#reasoning').value=String(p.reasoning);$('#vision').value=String(p.vision)};
$('#model-form').onsubmit=e=>{e.preventDefault();const id=$('#model-id').value.trim();if(!id||draft.models.some((m,i)=>m.id===id&&i!==editing)){$('#model-error').textContent='模型 ID 不能为空，也不能在当前供应商中重复。';return}const c=Number($('#context').value),max=Number($('#max-tokens').value);if(!Number.isSafeInteger(c)||!Number.isSafeInteger(max)||c<1||max<1){$('#model-error').textContent='请输入正整数 Token 数值。';return}const m={id,name:$('#model-name').value.trim()||id,context:c,max,reasoning:$('#reasoning').value==='true',vision:$('#vision').value==='true',test:'untested',time:null};if(editing<0)draft.models.push(m);else draft.models[editing]=m;$('#model-dialog').close();changed();notice('模型已加入草稿，请保存配置。')};
function commit(p){p.version++;p.models.forEach(m=>{m.test='untested';m.time=null});if(p.id){providers=providers.map(x=>x.id===p.id?p:x)}else{p.id=Math.max(0,...providers.map(x=>x.id))+1;providers.push(p)}selected=p.id;draft=copy(p);pending=null;dirty=false;draw();notice('配置已保存；模型需分别测试，已有项目保持原版本。')}
$('#provider-form').onsubmit=e=>{e.preventDefault();if(!dirty||pending)return;if(!draft.name.trim()||!draft.key||!draft.models.length){notice('请填写供应商名称、使用演示密钥并添加至少一个模型。');return}if($('#save-result').value==='unknown'){pending=copy(draft);renderParts();notice('保存结果待确认，请核查原保存。')}else commit(copy(draft))};
$('#query-save').onclick=()=>{if(pending)commit(pending)};$('#discard').onclick=()=>{if(pending)return;const p=providers.find(x=>x.id===selected)||providers[0];selected=p.id;draft=copy(p);dirty=false;draw();notice('已撤销未保存修改。')};
$('#models').onclick=e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const i=Number(b.dataset.index),m=draft.models[i];if(b.dataset.action==='edit'){openModel(i);return}if(b.dataset.action==='test'){m.test=m.test==='unknown'?'pass':$('#test-result').value;m.time=m.test==='unknown'?null:new Date().toLocaleTimeString('zh-CN',{hour12:false});providers.find(p=>p.id===selected).models[i]=copy(m);renderParts();notice(m.test==='unknown'?'本次测试结果未知，请查询原测试。':'这是演示测试结果，仅对应当前模型和保存版本。');return}if(b.dataset.action==='apply'){applying={provider:draft.name,providerId:draft.id,model:m.id,version:draft.version};$('#preview').innerHTML=`供应商：${esc(draft.name)} · v${draft.version}<br>模型：${esc(m.id)}<br>测试观察：${statuses[m.test]}<br>当前项目模型：${project?esc(project.provider+' / '+project.model):'未配置'}<br>执行配置：开发容器 · v2（保留）`;$('#project-dialog').showModal()}};
$('#apply-model').onclick=()=>{project=copy(applying);$('#project-dialog').close();renderParts();notice('示例项目已采用所选模型快照，未启动任务。')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#reset').onclick=()=>location.reload();draw();
})();
</script></body></html>
