#repomesh-rooms-prototype .rm-repo-choice{font-size:13px;margin:0;border-radius:0;min-height:67px;border-bottom:1px solid #272727}
#repomesh-rooms-prototype .rm-repo-choice small{color:#969696;display:flex;gap:10px;flex-wrap:wrap}
#repomesh-rooms-prototype .rm-repo-choice .pending{color:#d7b788}
#repomesh-rooms-prototype .rm-repo-choice .ok{color:#90b899}
#repomesh-rooms-prototype .rm-load{width:100%;justify-content:center;font-size:12px;padding:11px;color:#aaa}
#repomesh-rooms-prototype .rm-steps-footer{border-top:1px solid #303030;margin-top:21px;padding-top:16px;font-size:12px;color:#929292}
#repomesh-rooms-prototype .rm-login{min-height:calc(100vh - 55px);display:grid;place-items:center;padding:30px}
#repomesh-rooms-prototype .rm-login-box{width:min(100%,380px);text-align:center}
#repomesh-rooms-prototype .rm-login-box h1{font-size:27px;margin:22px 0 10px}
#repomesh-rooms-prototype .rm-login-box p{color:#999;font-size:13px;margin:0 0 28px}
#repomesh-rooms-prototype .rm-login-button{width:100%;justify-content:center;background:#e4e4e4;color:#181818;border-radius:9px;padding:12px;font-size:14px}
#repomesh-rooms-prototype .rm-login-button:hover{background:#fff}
#repomesh-rooms-prototype .rm-login-mark{border:1px solid #474747;border-radius:14px;width:56px;height:56px;display:inline-grid;place-items:center;font-size:24px}
#repomesh-rooms-prototype .rm-summary{width:min(100%,730px);margin:35px auto;padding:0 30px}
#repomesh-rooms-prototype .rm-summary h1{font-size:24px}
#repomesh-rooms-prototype .rm-success{color:#a8c7b0;margin-bottom:16px;font-size:13px}
#repomesh-rooms-prototype .rm-config-row{padding:17px 0;border-bottom:1px solid #303030;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px}
#repomesh-rooms-prototype .rm-config-row small{display:block;color:#999;margin-top:4px}
#repomesh-rooms-prototype .rm-config-row span{min-width:0;overflow-wrap:anywhere}
#repomesh-rooms-prototype .rm-config-row button{border:1px solid #404040;font-size:12px;flex-shrink:0}
#repomesh-rooms-prototype .rm-prototype-tools{border-top:1px solid #383838;background:#1b1b1b;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#999;font-size:11px;min-height:55px}
#repomesh-rooms-prototype .rm-prototype-tools button{border:1px solid #424242;padding:4px 9px;font-size:11px}
#repomesh-rooms-prototype .rm-prototype-tools strong{font-weight:500;color:#c6b59c}
#repomesh-rooms-prototype .rm-empty{text-align:center;padding:46px 15px;color:#999;font-size:13px}
#repomesh-rooms-prototype .rm-field select{display:block;background:#222;border:1px solid #3c3c3c;width:100%;padding:10px;margin-top:7px;font-size:13px}
#repomesh-rooms-prototype .rm-search-empty{padding:12px;color:#888;font-size:12px}
@media(max-width:800px){#repomesh-rooms-prototype .rm-shell{grid-template-columns:minmax(0,1fr)}#repomesh-rooms-prototype .rm-sidebar{display:none}#repomesh-rooms-prototype .rm-shell.rm-show-sidebar .rm-sidebar{display:flex}#repomesh-rooms-prototype .rm-mobile-button{display:inline-flex}}
@media(max-width:560px){#repomesh-rooms-prototype .rm-create-stage{padding:10px 12px 24px}#repomesh-rooms-prototype .rm-create-box{padding:20px 16px}#repomesh-rooms-prototype .rm-create-head h1{font-size:21px}#repomesh-rooms-prototype .rm-progress{gap:16px}#repomesh-rooms-prototype .rm-summary{padding:0 22px;margin-top:24px}#repomesh-rooms-prototype .rm-top-project{display:inline}#repomesh-rooms-prototype .rm-repo-choice{padding:12px 10px}#repomesh-rooms-prototype .rm-config-row{flex-wrap:wrap}#repomesh-rooms-prototype .rm-login{padding:24px}}
</style></head><body><!-- 原型问题：沿现有两步项目创建，登录/账号读取与工作授权是否清楚？仅内存模拟，不接入OAuth、密钥或业务接口。 --><div id="repomesh-rooms-prototype"></div><script>
(()=>{
const root=document.getElementById('repomesh-rooms-prototype');
const repos=[{id:'r1',name:'repomesh/order-service',owner:'自己的仓库',app:true},{id:'r2',name:'repomesh/admin-console',owner:'自己的仓库',app:true},{id:'r3',name:'partner/billing-api',owner:'受邀协作',app:false},{id:'r4',name:'repomesh/storefront',owner:'自己的仓库',app:true},{id:'r5',name:'team/test-assets',owner:'组织仓库',app:true}];
const state={page:'login',waiting:false,step:1,selected:new Set(),query:'',more:false,name:'',purpose:'',error:'',unknown:false,sidebar:false,saved:null,notice:''};
if(new URLSearchParams(location.search).get('screen')==='repositories')state.page='create';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={folder:'M3 7h6l2-3h10v16H3Z',search:'M21 21l-5-5 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',grid:'M3 3h18v18H3Z M9 3v18',check:'M5 12l4 4L19 6',user:'M5 21v-2a7 7 0 0 1 14 0v2 M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.grid}"/></svg>`;
const btn=(text,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${text}</button>`;
function side(){return `<aside class="rm-sidebar"><div class="rm-brand">${icon('grid')}<span>RepoMesh</span></div><nav class="rm-nav" aria-label="主导航">${btn('+ 新建项目','create',state.page==='create'?'rm-active':'')}${btn('项目设置','overview','',!state.saved)}</nav><div class="rm-label">项目与会话</div>${state.saved?`<div class="rm-project">${btn(icon('folder')+esc(state.saved.name),'overview','rm-project-head')}<div class="rm-search-empty">暂无会话</div></div>`:'<div class="rm-search-empty">还没有项目</div>'}<div class="rm-sidebar-bottom">${btn('⚙ 设置','settings')}<div class="rm-profile"><span class="rm-avatar">林</span>林悦<span class="rm-quiet">示例账号</span></div></div></aside>`}
function login(){return `<main class="rm-login"><div class="rm-login-box"><div class="rm-login-mark">▧</div><h1>开始使用 RepoMesh</h1><p>把相关仓库组织成项目，和 Manager 一起推进工作。</p>${state.waiting?'<div class="rm-confirm" role="status">等待登录完成…<p class="rm-note" style="margin:10px 0 0">完成后回到这里，继续创建项目。</p></div>'+btn('返回','login-back'):btn('使用 GitHub 登录','login','rm-login-button')}<p style="font-size:11px;margin-top:23px">登录账号与仓库工作授权分别管理。</p></div></main>`}
function repoList(){if(state.unknown)return `<div class="rm-confirm" role="status">仓库权限待重新核查，暂不展示旧仓库内容。</div>`;const matches=repos.filter(r=>r.name.toLowerCase().includes(state.query.toLowerCase()));const shown=state.more||state.query?matches:matches.slice(0,3);return `<div class="rm-repo-box"><div class="rm-repo-search">${icon('search')}<input aria-label="搜索仓库" placeholder="搜索当前已发现的仓库" value="${esc(state.query)}"></div><div class="rm-repo-label"><span>当前已发现</span><span aria-live="polite">已选择 ${state.selected.size} 个</span></div>${shown.map(r=>`<label class="rm-repo-choice"><input type="checkbox" data-repo="${r.id}" aria-label="选择 ${r.name}" ${state.selected.has(r.id)?'checked':''}>${icon('folder')}<span>${esc(r.name)}<small><span>${r.owner} · 账号可读取</span><span class="${r.app?'ok':'pending'}">${r.app?'App 工作授权可用':'App 工作授权待补齐'}</span></small></span></label>`).join('')||'<div class="rm-empty">没有匹配结果，试试其他关键词。</div>'}${!state.more&&!state.query&&matches.length>3?btn('加载更多已发现仓库','more','rm-load'):'<div class="rm-repo-label">当前已发现的结果已显示</div>'}</div>`}
function wizard(){return `<section class="rm-create-stage"><div class="rm-progress"><span class="${state.step===1?'on':''}">01 选择仓库</span><span class="${state.step===2?'on':''}">02 项目资料</span></div><form class="rm-create-box" aria-label="创建多仓库项目"><div class="rm-create-head"><div><h1>${state.step===1?'创建多仓库项目':'给项目起个名字'}</h1><p>${state.step===1?'选择需要一起协作的仓库。':'说明共同目标，让 Manager 理解各仓关系。'}</p></div>${btn('×','cancel','rm-close')}</div>${state.step===1?`${repoList()}<div class="rm-create-account">${icon('user')}林悦 · GitHub 示例账号</div><div class="rm-coverage">当前只展示已发现并核实可读的仓库，可能还有未发现的仓库。<br>App 工作授权待补齐的仓库也可加入项目，执行前再补齐授权。</div>`:`<label class="rm-field">项目名称<input data-field="name" aria-label="项目名称" placeholder="例如：订单系统" value="${esc(state.name)}"></label><label class="rm-field">项目用途<textarea data-field="purpose" aria-label="项目用途" placeholder="例如：订单服务与运营后台，共同支持订单管理">${esc(state.purpose)}</textarea></label><div class="rm-note">已选项目范围 ${state.unknown?'待重新核查':'· '+state.selected.size+' 个仓库'}</div>${state.unknown?'<div class="rm-alert" role="status">暂时无法确认所选范围的读取权限。已保留输入，核查成功后再保存。</div>':`<div class="rm-selected-repos">${repos.filter(r=>state.selected.has(r.id)).map(r=>`<span>${esc(r.name)}</span>`).join('')}</div>`}<details class="rm-confirm"><summary>项目默认配置 <span class="rm-badge amber">模型待配置</span></summary><div class="rm-detail-row"><span>模型</span><span>继承默认 · 尚无可用配置</span></div><div class="rm-detail-row"><span>执行环境</span><span>继承默认配置</span></div><div class="rm-detail-row"><span>Worker 并发</span><span>1</span></div><div class="rm-detail-row"><span>预算与时限</span><span>尚未取得有效值</span></div><div class="rm-detail-row"><span>验证小组</span><span>关闭</span></div><p class="rm-note">可以先保存项目，在设置中补齐模型连接和必要配置。</p></details>`}${state.error?`<p class="rm-alert" role="alert">${esc(state.error)}</p>`:''}<div class="rm-create-actions">${btn(state.step===1?'取消':'上一步',state.step===1?'cancel':'back')}${btn(state.step===1?'继续':'保存项目',state.step===1?'next':'save','rm-primary',!state.selected.size||state.unknown)}</div><div class="rm-steps-footer">保存项目后，再创建会话或 Issue。项目保存本身不会启动实例。</div></form></section>`}
function overview(){const p=state.saved;return `<section class="rm-summary">${state.notice?`<div class="rm-success" role="status">${icon('check')} ${esc(state.notice)}</div>`:''}<h1>${esc(p.name)}</h1><p class="rm-note">${esc(p.purpose)}</p><div class="rm-confirm"><div class="rm-confirm-title">继续完善项目 <span class="rm-badge amber">待配置</span></div><p class="rm-note">项目已经保留。补齐本次工作需要的配置后，就可以创建 Issue。</p><div class="rm-config-row"><span>模型连接<small>尚无可用默认配置</small></span>${btn('查看设置 →','settings')}</div><div class="rm-config-row"><span>执行配置<small>预算与时限尚未取得有效值</small></span>${btn('查看配置 →','settings')}</div>${p.ids.includes('r3')?'<div class="rm-config-row"><span>partner/billing-api<small>账号可读取，App 工作授权待补齐</small></span><span class="rm-badge amber">授权待补齐</span></div>':''}</div><h2 style="font-size:15px;font-weight:500;margin-top:28px">项目仓库 · ${p.ids.length}</h2>${repos.filter(r=>p.ids.includes(r.id)).map(r=>`<div class="rm-config-row"><span>${esc(r.name)}</span><span class="rm-badge ${r.app?'green':'amber'}">${r.app?'App 工作授权可用':'App 工作授权待补齐'}</span></div>`).join('')}<p class="rm-note" style="margin-top:24px">暂无会话 · 暂无 Issue · 实例尚未启动</p>${btn('新建另一个项目','create')}</section>`}
function settings(){return `<section class="rm-summary"><h1>设置</h1><p class="rm-note">账号连接与默认配置</p><div class="rm-config-row"><span>GitHub 账号<small>林悦 · 示例账号已连接</small></span><span class="rm-badge green">已连接</span></div><div class="rm-config-row"><span>模型连接<small>在这里管理模型与 API Key，项目通过配置引用使用。</small></span><span class="rm-badge amber">尚未配置</span></div><div class="rm-config-row"><span>执行默认配置<small>Worker 并发 1 · 验证小组关闭</small></span><span class="rm-badge amber">预算与时限待补齐</span></div><p class="rm-note" style="margin:24px 0">本轮先讨论入口与项目流程；模型和授权设置表单将在后续原型中展开。</p>${btn(state.saved?'返回项目':'返回项目创建',state.saved?'overview':'resume')}</section>`}
function empty(){return `<section class="rm-summary"><h1>先创建一个项目</h1><p class="rm-note">把相关仓库放在一起，再开始对话或创建 Issue。</p>${btn('创建项目','resume','rm-primary')}</section>`}
function tools(){return `<footer class="rm-prototype-tools" aria-label="原型演示控制"><strong>独立原型 · 不连接真实账号</strong>${state.waiting?btn('模拟登录完成 →','login-done'):''}${state.page==='create'&&(state.step===2||state.unknown)?btn(state.unknown?'模拟权限核查恢复':'模拟所选范围核查未知','permission'):''}${btn('从登录开始','reset')}<span>仅内存数据，刷新重置</span></footer>`}
let lastScreen='';
function render(){const screen=state.page+':'+state.step;const scrollTop=screen!==lastScreen;lastScreen=screen;root.innerHTML=(state.page==='login'?login():`<div class="rm-shell ${state.sidebar?'rm-show-sidebar':''}">${side()}<main class="rm-main"><header class="rm-top"><div class="rm-top-left">${btn('☰','sidebar','rm-mobile-button')}<span class="rm-top-project">${state.saved?esc(state.saved.name):'RepoMesh'}</span><span>／ ${state.page==='create'?'新建项目':state.page==='settings'?'设置':'项目'}</span></div><span>林悦</span></header>${state.page==='create'?wizard():state.page==='overview'?overview():state.page==='settings'?settings():empty()}</main></div>`)+tools();if(scrollTop)window.scrollTo(0,0);}
function save(){if(state.unknown||!state.selected.size)return;if(!state.name.trim()||!state.purpose.trim()){state.error='请填写项目名称与用途。';render();return}if([...state.name].length>200||[...state.purpose].length>20000){state.error='项目名称最多 200 个字符，用途最多 20,000 个字符。';render();return}state.saved={name:state.name,purpose:state.purpose,ids:[...state.selected]};state.page='overview';state.notice='项目已保存';render();}
root.addEventListener('input',e=>{if(e.target.dataset.field)state[e.target.dataset.field]=e.target.value;if(e.target.matches('.rm-repo-search input')){const pos=e.target.selectionStart;state.query=e.target.value;render();const el=root.querySelector('.rm-repo-search input');el.focus();el.setSelectionRange(pos,pos)}});
root.addEventListener('change',e=>{if(e.target.dataset.repo){e.target.checked?state.selected.add(e.target.dataset.repo):state.selected.delete(e.target.dataset.repo);state.error='';render();root.querySelector(`[data-repo="${e.target.dataset.repo}"]`)?.focus()}});
root.addEventListener('submit',e=>{e.preventDefault();if(state.step===1&&state.selected.size&&!state.unknown){state.step=2;render()}else if(state.step===2)save()});
root.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='login')state.waiting=true;if(a==='login-back')state.waiting=false;if(a==='login-done'){state.waiting=false;state.page='create'}if(a==='next'&&state.selected.size&&!state.unknown)state.step=2;if(a==='back'){state.step=1}if(a==='more')state.more=true;if(a==='cancel')state.page=state.saved?'overview':'empty';if(a==='resume')state.page='create';if(a==='create'){state.page='create';state.step=1;state.selected=new Set();state.name='';state.purpose='';state.query='';state.error='';state.unknown=false;state.more=false}if(a==='settings')state.page='settings';if(a==='overview'&&state.saved){state.page='overview';state.notice=''}if(a==='permission')state.unknown=!state.unknown;if(a==='sidebar')state.sidebar=!state.sidebar;if(a==='reset'){location.href=location.pathname;return}if(a==='save'){save();return}render();});
render();
})();
</script></body></html>
